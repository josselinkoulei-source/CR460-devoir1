name: Terraform - approbation manuelle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-cr460-devoir1
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: cr460-jkoulei-2026
  TF_WORKSPACE: cr460-devoir1
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

jobs:
  plan:
    name: Terraform plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      run_id: ${{ steps.plan_run.outputs.run_id }}
      run_link: ${{ steps.plan_run.outputs.run_link }}
      confirmable: ${{ steps.plan_run.outputs.payload != '' && fromJSON(steps.plan_run.outputs.payload).data.attributes.actions.IsConfirmable }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verifier l'acces HCP et le mode manuel
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TF_API_TOKEN:-}" ]]; then
            echo "::error::Le secret GitHub TF_API_TOKEN est absent ou vide."
            exit 1
          fi

          response_file="$RUNNER_TEMP/hcp-workspace.json"

          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --header "Authorization: Bearer $TF_API_TOKEN" \
            --header "Accept: application/vnd.api+json" \
            --output "$response_file" \
            "https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORGANIZATION/workspaces/$TF_WORKSPACE"

          if ! jq -e '.data.attributes["auto-apply"] | type == "boolean"' "$response_file" > /dev/null; then
            echo "::error::La reponse HCP Terraform est invalide ou incomplete."
            exit 1
          fi

          if ! jq -e '.data.attributes["auto-apply"] == false' "$response_file" > /dev/null; then
            echo "::error::Auto apply est active. Choisis Manual apply dans HCP Terraform, Settings, General."
            exit 1
          fi

          echo "Acces au workspace confirme. Auto apply est desactive."

      - name: Envoyer la configuration a HCP Terraform
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ./
          speculative: "false"

      - name: Executer le plan dans HCP Terraform
        id: plan_run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: "false"

      - name: Afficher le lien du plan
        env:
          RUN_LINK: ${{ steps.plan_run.outputs.run_link }}
        run: |
          echo "Plan a examiner : $RUN_LINK" >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform apply apres approbation
    needs: plan
    if: needs.plan.outputs.confirmable == 'true'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ needs.plan.outputs.run_link }}

    steps:
      - name: Appliquer le plan approuve
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        with:
          run: ${{ needs.plan.outputs.run_id }}
          comment: "Approbation manuelle obtenue dans GitHub Actions"